<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Real Sensi Generator</title>
    <style>
        /* Modern Dark BGMI Theme */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.2);
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            color: #ff9900;
            margin-bottom: 20px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: bold;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        select {
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #444;
            cursor: pointer;
        }

        button {
            background: linear-gradient(45deg, #ff9900, #ffcc00);
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        #resultArea {
            margin-top: 25px;
            display: none; /* Hidden by default */
            background-color: #252525;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ff9900;
        }

        .sens-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .sens-row:last-child {
            border-bottom: none;
        }

        .label-sensi {
            color: #aaa;
        }

        .value-sensi {
            color: #ff9900;
            font-weight: bold;
        }

        .note {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Pro Sensi Gen</h1>
    
    <div class="form-group">
        <label for="deviceSelect">Select Your Device:</label>
        <select id="deviceSelect">
            <option value="iphone_13">iPhone 13 / 13 Pro</option>
            <option value="iphone_14_pro">iPhone 14 Pro Max</option>
            <option value="redmi_note_10">Redmi Note 10 / 10 Pro</option>
            <option value="realme_gt_neo_3">Realme GT Neo 3</option>
            <option value="moto_g54">Moto G54 5G</option>
            <option value="redmi_9a">Redmi 9A / 10A</option>
            <option value="samsung_s23">Samsung S23 Ultra</option>
        </select>
    </div>

    <div class="form-group">
        <label for="playStyle">Your Play Style:</label>
        <select id="playStyle">
            <option value="aggressive">Aggressive (Flicker)</option>
            <option value="passive">Passive (Dragger)</option>
            <option value="balanced">Balanced</option>
        </select>
    </div>

    <button onclick="generateSensi()">Generate Real Sensitivity</button>

    <div id="resultArea">
        <h3 style="margin-top:0; color:white;">Your Settings:</h3>
        <div class="sens-row"><span class="label-sensi">General:</span> <span class="value-sensi" id="out_general">0</span></div>
        <div class="sens-row"><span class="label-sensi">Camera (TPP):</span> <span class="value-sensi" id="out_camera">0</span></div>
        <div class="sens-row"><span class="label-sensi">Red Dot:</span> <span class="value-sensi" id="out_red_dot">0</span></div>
        <div class="sens-row"><span class="label-sensi">Scope 2x:</span> <span class="value-sensi" id="out_scope_2x">0</span></div>
        <div class="sens-row"><span class="label-sensi">Scope 3x:</span> <span class="value-sensi" id="out_scope_3x">0</span></div>
        <div class="sens-row" style="background:#333; padding:5px; border-radius:5px;"><span class="label-sensi">Gyro Multiplier:</span> <span class="value-sensi" id="out_gyro">0</span></div>
        
        <p class="note">*Settings are generated based on device touch sampling rate.</p>
    </div>
</div>

<script>
    // 1. The Database of Devices with Specific Characteristics
    const deviceDatabase = {
        // High End - Fast Touch, Needs Lower Sens for Stability
        'iphone_13': { category: 'high', offset: 5, gyroBase: 320 },
        'iphone_14_pro': { category: 'high', offset: 8, gyroBase: 350 },
        'samsung_s23': { category: 'high', offset: 6, gyroBase: 330 },
        
        // Mid Range - Balanced
        'redmi_note_10': { category: 'mid', offset: 15, gyroBase: 380 },
        'realme_gt_neo_3': { category: 'mid', offset: 12, gyroBase: 370 },
        'moto_g54': { category: 'mid', offset: 18, gyroBase: 390 },
        
        // Low End - Slow Touch, Needs Higher Sens
        'redmi_9a': { category: 'low', offset: 25, gyroBase: 420 }
    };

    function generateSensi() {
        // Get User Inputs
        const deviceId = document.getElementById('deviceSelect').value;
        const style = document.getElementById('playStyle').value;
        
        // Run Logic
        const result = getRealSensitivity(deviceId, style);
        
        // Display Results
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('out_general').innerText = result.general;
        document.getElementById('out_camera').innerText = result.camera;
        document.getElementById('out_red_dot').innerText = result.red_dot;
        document.getElementById('out_scope_2x').innerText = result.scope_2x;
        document.getElementById('out_scope_3x').innerText = result.scope_3x;
        document.getElementById('out_gyro').innerText = result.gyro_multiplier;
    }

    function getRealSensitivity(deviceId, playStyle) {
        let deviceData = deviceDatabase[deviceId] || { category: 'mid', offset: 15, gyroBase: 380 };
        
        let baseGeneral = 0;
        let baseCamera = 0;
        let baseRedDot = 0;
        let baseScope2x = 0;
        let baseScope3x = 0;

        // Base values based on hardware category
        if (deviceData.category === 'high') {
            baseGeneral = 50; baseCamera = 45; baseRedDot = 40; baseScope2x = 35; baseScope3x = 30;
        } else if (deviceData.category === 'mid') {
            baseGeneral = 65; baseCamera = 60; baseRedDot = 55; baseScope2x = 50; baseScope3x = 45;
        } else { 
            baseGeneral = 80; baseCamera = 75; baseRedDot = 70; baseScope2x = 65; baseScope3x = 60;
        }

        // Apply Device-Specific Offset
        baseGeneral += deviceData.offset;
        baseCamera += deviceData.offset;
        baseRedDot += deviceData.offset;
        baseScope2x += deviceData.offset;
        baseScope3x += deviceData.offset;

        // Adjust for Playstyle
        if (playStyle === 'aggressive') {
            baseGeneral += 10; baseCamera += 10;
        } else if (playStyle === 'passive') {
            baseGeneral -= 5; baseCamera -= 5;
        }

        return {
            general: Math.min(100, Math.max(10, baseGeneral)),
            camera: Math.min(100, Math.max(10, baseCamera)),
            red_dot: Math.min(100, Math.max(10, baseRedDot)),
            scope_2x: Math.min(100, Math.max(10, baseScope2x)),
            scope_3x: Math.min(100, Math.max(10, baseScope3x)),
            gyro_multiplier: deviceData.gyroBase + (playStyle === 'aggressive' ? 20 : (playStyle === 'passive' ? -10 : 0))
        };
    }
</script>

</body>
</html>
